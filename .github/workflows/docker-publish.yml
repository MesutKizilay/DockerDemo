name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mesutkizilay/dockerdemoapi

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./DockerDemo.API/Dockerfile
          push: true
          tags: |
            ghcr.io/mesutkizilay/dockerdemoapi:latest
            ghcr.io/mesutkizilay/dockerdemoapi:sha-${{ github.sha }}


  test-local-runner:
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Test self-hosted runner
        shell: powershell
        run: |
          Write-Host "Self-hosted runner calisiyor"
          hostname
          whoami